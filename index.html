<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eWorkOrder | Login</title>
</head>
<body>
<div class="auth-wrapper">
<div class="auth-left">
      <div class="text-center">
        <div class="brand-logo mx-auto">
          <i class="bi bi-diagram-3"></i><i class="bi bi-arrow-right-short accent-arrow"></i>
        </div>
        <div class="brand-tagline mb-2">Intelligent Asset Management</div>
        <h2 class="fw-bold">eWorkOrder</h2>
        <p class="opacity-75 px-4">Intelligent Asset Management &amp; Work Execution Platform by Baker Hughes.</p>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <div class="text-center mb-4">
          <div class="brand-logo mx-auto">
            <i class="bi bi-diagram-3"></i><i class="bi bi-arrow-right-short accent-arrow"></i>
          </div>
          <h3 class="fw-bold mb-1">Welcome Back</h3>
          <p class="text-muted mb-0">Sign in to continue to your dashboard</p>
        </div>

        <div id="loginError" class="alert alert-danger d-none" role="alert">
          Invalid email or password
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">Remember me</label>
            </div>
            <a href="/forgot-password.html" class="small text-decoration-none">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
        </form>

        <p class="text-center small text-muted mt-4">
          Having issues logging in? <a href="#" class="text-decoration-none">Contact Support</a>
        </p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
