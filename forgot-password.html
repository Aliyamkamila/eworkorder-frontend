<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>eWorkOrder | Forgot Password</title>
</head>
<body>
  <div class="auth-wrapper">
<div class="auth-left">
      <div class="text-center">
        <div class="brand-logo mx-auto">
          <i class="bi bi-diagram-3"></i><i class="bi bi-arrow-right-short accent-arrow"></i>
        </div>
        <div class="brand-tagline mb-2">Intelligent Asset Management</div>
        <h2 class="fw-bold">eWorkOrder</h2>
        <p class="opacity-75 px-4">Intelligent Asset Management &amp; Work Execution Platform by Baker Hughes.</p>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <h3 class="fw-bold mb-1">Forgot Password</h3>
        <p class="text-muted mb-4">Enter your username to receive a reset code via email.</p>
        <form id="forgotForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" placeholder="Enter your username" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Request New Password</button>
          <a href="/index.html" class="btn btn-outline-secondary w-100 py-2">Back to Login</a>
        </form>
        <hr class="my-4">
        <p class="text-center small text-muted">
          Having issues logging in? <a href="#" class="text-decoration-none">Contact Support</a>
        </p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/pages/forgot-password.js"></script>
</body>
</html>
